# Applied on top of tracking_control_split.yaml by repeat_drive_session.py.
# Controller costs, reference generation and branch constraints stay in the base file.
px4_ekf_bridge:
  ros__parameters:
    connection_url: "udpin:0.0.0.0:14541"
    output_pose_topic: "/px4/sih/odom"
    publish_yaw_scalar_pose: true
    configure_px4_parameters: false
px4_odom_map_bridge:
  ros__parameters:
    route_name: "scenario3"
    enable_batch_reanchor: true
    output_topic: "/motive/vehicle/odom_map"
upper_planner_node:
  ros__parameters:
    scale_mode: "fullscale"
    state_input_type: "odom"
    odom_topic: "/motive/vehicle/odom_map"
    global_path_topic: "/navigation/global_path"
    lower_reference_path_topic: "/planner/lower_reference_path"
    require_grid_map: true
    input_timeout_sec: 3.0
    grid_value_threshold: 1
    use_csv_global_path: false
    reset_waypoint_on_path_update: true
    enable_batch_mission_reset: true
    # Batch checks route progress AND distance; upper's remaining=0 is insufficient.
    goal_stop_distance_m: -1.0
lower_tracking_mpc_node:
  ros__parameters:
    scale_mode: "fullscale"
    state_input_type: "odom"
    odom_topic: "/motive/vehicle/odom_map"
    lower_reference_path_topic: "/planner/lower_reference_path"
    pixhawk_output_backend: "mavlink_udp"
    mavlink_enable: true
    mavlink_bind_ip: "0.0.0.0"
    mavlink_bind_port: 14540
    mavlink_auto_manual_mode: false
    mavlink_auto_arm: false
    mavlink_force_arm: false
    batch_supervision: true
    reset_on_path_change: true
knu_batch_runner:
  ros__parameters:
    routes: ["scenario3"]
    repeat_count: 10
    require_recorder: true
    reset_upper_each_attempt: true
    recorder_timeout_sec: 2.0
    stationary_timeout_sec: 60.0
    route_timeout_sec: 180.0
