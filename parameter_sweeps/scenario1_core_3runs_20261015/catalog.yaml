version: 1
default_scenarios:
- scenario1
default_runs: 3
default_sets:
- baseline
- planner_2
- planner_10
- controller_20_horizon3
- heading_soft
- heading_strong
- upper_heading_smooth
- heading_limit_tight
- steering_smooth
baseline:
  upper_planner_node:
    upper_planner_rate_hz: 5.0
    upper_prediction_dt_sec: 0.5
    upper_preview_steps: 7
    lower_prediction_dt_sec: 0.1
    lambda_relative_turn: 0.6
    upper_r_dpsi: 3.0
    max_steering_angle_rad: 0.3
  lower_tracking_mpc_node:
    lower_controller_rate_hz: 10.0
    lower_prediction_dt_sec: 0.1
    lower_prediction_steps: 30
    lower_q_heading: 0.5
    lower_rd_steering_rate: 150.0
    lower_max_steering_rate_radps: 1.0471975512
  knu_batch_runner:
    stationary_confirm_sec: 0.5
    map_settle_sec: 0.3
    reference_min_wait_sec: 0.3
sets:
  baseline:
    label: '기준: 플래너5Hz / 제어10Hz / 예측3초'
    changes: {}
  planner_2:
    label: 플래너2Hz
    changes:
      upper_planner_node:
        upper_planner_rate_hz: 2.0
  planner_10:
    label: 플래너10Hz
    changes:
      upper_planner_node:
        upper_planner_rate_hz: 10.0
  controller_20_horizon3:
    label: 제어20Hz / 예측3초 유지
    changes:
      lower_tracking_mpc_node:
        lower_controller_rate_hz: 20.0
        lower_prediction_dt_sec: 0.05
        lower_prediction_steps: 60
  heading_soft:
    label: 상위 도로 헤딩 비용 약하게
    changes:
      upper_planner_node:
        lambda_relative_turn: 0.3
  heading_strong:
    label: 상위 도로 헤딩 비용 강하게
    changes:
      upper_planner_node:
        lambda_relative_turn: 1.2
  upper_heading_smooth:
    label: 상위 헤딩 보정 비용 강화
    changes:
      upper_planner_node:
        upper_r_dpsi: 6.0
  heading_limit_tight:
    label: '헤딩 변화 한계 강화: 상위 조향 한계0.25rad'
    changes:
      upper_planner_node:
        max_steering_angle_rad: 0.25
  steering_smooth:
    label: 하위 조향 변화 비용 강화
    changes:
      lower_tracking_mpc_node:
        lower_rd_steering_rate: 300.0
  lower_heading_strong:
    label: 하위 헤딩 추종 비용 강화
    changes:
      lower_tracking_mpc_node:
        lower_q_heading: 1.0
  steering_rate_tight:
    label: 하위 조향 변화속도 제한30도/초
    changes:
      lower_tracking_mpc_node:
        lower_max_steering_rate_radps: 0.5235987756
  combined_smooth:
    label: 헤딩·조향 비용과 변화 한계 조합
    changes:
      upper_planner_node:
        lambda_relative_turn: 1.2
        upper_r_dpsi: 6.0
        max_steering_angle_rad: 0.25
      lower_tracking_mpc_node:
        lower_rd_steering_rate: 300.0
  controller_20_horizon1_5:
    label: 제어20Hz / 기존 시험의 짧은 예측1.5초
    changes:
      lower_tracking_mpc_node:
        lower_controller_rate_hz: 20.0
        lower_prediction_dt_sec: 0.05
        lower_prediction_steps: 30
